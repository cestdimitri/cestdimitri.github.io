<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>DA — Dimitrii Andreenko</title>

  <defs>
    <!-- solid through the core, alpha falling to zero at the rim,
         so the dot has no hard edge and dissolves into the page -->
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1B4EF5" stop-opacity="1"/>
      <stop offset="66%"  stop-color="#1B4EF5" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#1B4EF5" stop-opacity="0.62"/>
      <stop offset="91%"  stop-color="#1B4EF5" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1B4EF5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#dot)"/>

  <text x="32" y="42.5"
        text-anchor="middle"
        font-family="Instrument Serif, Playfair Display, Georgia, 'Times New Roman', serif"
        font-size="27"
        letter-spacing="-0.5"
        fill="#ffffff">DA</text>
</svg>
